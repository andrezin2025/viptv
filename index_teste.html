<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tradução com Google</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .flags-container {
            margin-top: 20px;
        }
        .flags-container img {
            width: 32px; 
            margin: 0 10px;
            cursor: pointer; /* Muda o cursor para indicar que é clicável */
        }
    </style>
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'pt',
                includedLanguages: 'en,es,fr,de,it,pt',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }

        function changeLanguage(lang) {
            var googleTranslate = document.querySelector('.goog-te-combo');
            if (googleTranslate) {
                googleTranslate.value = lang; // Define o valor do idioma
                googleTranslate.dispatchEvent(new Event('change')); // Dispara a troca de idioma
            }
        }
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body>

    <h1>Bem-vindo ao nosso site!</h1>
    <p>Este é um exemplo de como usar o Google Translate com bandeiras.</p>

    <div id="google_translate_element" style="display:none;"></div> <!-- Esconde o elemento do Google Translate -->

    <div class="flags-container">
        <img src="https://upload.wikimedia.org/wikipedia/en/a/a4/Flag_of_the_United_States.svg" alt="English" onclick="changeLanguage('en');">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Flag_of_Spain.svg" alt="Español" onclick="changeLanguage('es');">
        <img src="https://upload.wikimedia.org/wikipedia/en/c/c3/Flag_of_France.svg" alt="Français" onclick="changeLanguage('fr');">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/ba/Flag_of_Germany.svg" alt="Deutsch" onclick="changeLanguage('de');">
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/03/Flag_of_Italy.svg" alt="Italiano" onclick="changeLanguage('it');">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Flag_of_Portugal.svg" alt="Português" onclick="changeLanguage('pt');">
    </div>

</body>
</html>
